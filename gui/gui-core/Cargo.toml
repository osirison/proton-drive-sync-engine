[package]
name = "proton-sync-gui-core"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust data layer for the Proton Drive Sync desktop GUI. Reads the daemon's control socket, JSON state sidecars, config file, conflict sidecars, and dry-run plans, reusing the engine's own wire types so the GUI can never drift from the daemon's JSON. No GUI/webkit dependency — builds and tests standalone."

[dependencies]
proton-drive-sync-engine = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
rusqlite = { version = "0.40.1", features = ["bundled"] }
# `statvfs` for the free-space check on the local root (C4). Already in the tree as a transitive
# dependency of the Tauri stack; taken directly here so the syscall is a safe call rather than an
# `unsafe` libc block in a crate that has none.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
