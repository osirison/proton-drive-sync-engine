[package]
name = "proton-sync-gui"
version = "0.1.0"
edition = "2021"
description = "Proton Drive Sync — Linux desktop GUI (Tauri shell). A thin client of proton-syncd; all logic lives in proton-sync-gui-core."
default-run = "proton-sync-gui"

[lib]
name = "proton_sync_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gui_core = { package = "proton-sync-gui-core", path = "../gui-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
# `test` gives us `tauri::test::mock_builder`, so the socket commands can be driven headlessly
# (no webview/display) against a fake daemon over a real Unix socket.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
