<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Proton Drive Sync</title>
    <!-- F4 deleted legacy-tokens.css, app.css and components.css along with the v1 screens they
         styled. What is left is the design-v2 stack, in dependency order: tokens, then the reset and
         @font-face, then one stylesheet per foundation primitive. Each of the last three carries
         rules that cannot be inline — @keyframes and media queries — and each needs its own <link>
         here. Forgetting one is silent: the mark stops animating, or the seam snaps instead of
         fading, with no error and nothing for lint or CI to catch. -->
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="styles/controls.css" />
    <link rel="stylesheet" href="styles/rows.css" />
    <link rel="stylesheet" href="styles/bands.css" />
    <link rel="stylesheet" href="styles/dialog.css" />
    <link rel="stylesheet" href="styles/hexagon.css" />
    <link rel="stylesheet" href="styles/seam.css" />
    <link rel="stylesheet" href="styles/compact.css" />
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
