[package]
name = "proton-drive-sync-engine"
version = "0.1.0"
edition = "2024"

# The desktop GUI (Tauri) lives in `gui/`. `gui-core` is the pure-Rust data layer that reuses this
# crate's wire types; `gui/src-tauri` is the Tauri shell (needs webkit2gtk-4.1 + libsoup-3.0 to
# build — installed in CI).
[workspace]
members = ["gui/gui-core", "gui/src-tauri"]
resolver = "2"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
fs2 = "0.4"
globset = "0.4"
indicatif = "0.18"
notify = "8.2.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
tokio = { version = "1.53.0", features = ["full"] }
toml = "1.1"
# Local deletions go to the desktop trash by default (`src/trash.rs`). Taken with
# `default-features = false` to drop the Windows-only `coinit_*` defaults, and `chrono` taken
# back explicitly because it is what writes `DeletionDate` into the `.trashinfo` file — without
# it the entry lands with no timestamp and a file manager cannot sort or age it.
trash = { version = "5.2.6", default-features = false, features = ["chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
