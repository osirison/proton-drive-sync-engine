[package]
name = "proton-drive-sync-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
notify = "8.2.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
tokio = { version = "1.53.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
