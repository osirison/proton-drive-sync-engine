name: Security audit

# The build-failing CVE gate for Rust dependencies (RustSec advisory DB, via cargo-audit).
# Runs on every PR and on push to main so a vulnerable crate cannot merge, and on a daily
# cron so a CVE published against code already on main — with no open PR — is still caught.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # rustsec/audit-check opens/updates a tracking issue on scheduled runs
  checks: write # ...and posts a check annotation on PRs

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Rust dependencies against the RustSec advisory DB
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
