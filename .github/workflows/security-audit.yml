name: Security audit

# The build-failing CVE gate for Rust dependencies (RustSec advisory DB, via cargo-audit).
# Runs on every PR and on push to main so a vulnerable crate cannot merge, and on a daily
# cron so a CVE published against code already on main — with no open PR — is still caught
# (the scheduled run turns red; Dependabot security updates also open a fix PR in parallel).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege: cargo-audit only reads the checked-out lockfile. A vulnerable crate fails
# the job (blocking the PR / turning the scheduled run red) — no check or issue writes needed.
permissions:
  contents: read

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.86.8
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies against the RustSec advisory DB
        run: cargo audit
