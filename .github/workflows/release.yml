name: Release

# A pushed version tag becomes a DRAFT GitHub release (openspec change add-linux-release-pipeline,
# design D12). Nothing here publishes a release or touches a distribution channel: a person
# publishes the draft, and publish.yml (a later change) does the rest.
#
#   gate      the tag is v plus the Cargo.toml version, the commit is on main, version.sh check
#   ci        the full CI suite, called from ci.yml
#   packages  the tarball, the three package builds and the install smoke tests, called from
#             packages.yml (the same jobs a pull request runs)
#   draft     SHA256SUMS and the draft release; the only job that can write to the repository
#
# `ci` and `packages` need `gate`, so a bad tag builds nothing, and `draft` needs all three, so a
# failed test or build leaves no release. The gate and draft logic is in packaging/release/*.sh,
# which tests/scripts.rs runs with stubs. This is the only workflow that runs on a tag push: the
# other push triggers in this directory are filtered to branches or paths (tests/scripts.rs checks).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One run per tag at a time, never cancelled: a second run starting while the first is in the
# middle of creating its draft could make a second draft. The called workflows have groups of
# their own (packages.yml's is per run), so the names never meet.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # A tag-push checkout is shallow and has no origin/main. The whole history is fetched, and
      # main is fetched again by name so the ref the gate compares with exists and is current.
      # The gate fails closed if either did not work.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/release/gate.sh "$TAG"

  # A caller job grants the permissions the called jobs ask for. ci.yml and packages.yml both ask
  # for `contents: read` at the top and set no permissions on any job.
  ci:
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  packages:
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml

  draft:
    needs: [gate, ci, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The token that can write is given to the script's environment below, not left in .git.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The four artifacts packages.yml uploads, by name, into one directory.
      - uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: rpm-packages
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: deb-packages
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: arch-package
          path: assets
      - name: Create or replace the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l assets
          packaging/release/draft.sh "$TAG" assets
