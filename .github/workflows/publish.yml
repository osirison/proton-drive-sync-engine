name: Publish

# A published GitHub release becomes a build on the distribution channels (openspec change
# add-linux-release-pipeline, design D9, D11, D12). release.yml made the draft; a person published
# it; this workflow follows.
#
#   publish   ONE job, in the environment `release`, the only job that can read the four secrets,
#             so a run asks for ONE approval. Its steps, in order:
#               route       the release's prerelease flag (from the API) picks the channels
#               gate        the tag is checked out and passes release.yml's gate
#               credentials the four secrets are written to files (the only step that reads them)
#               preflight   every credential is tried and every failure listed, before any channel
#               apt         apt-publish.sh (rebuilds the whole apt tree from the published releases)
#               AUR         aur-publish.sh
#               COPR        copr.sh, which submits and then waits for the builds
#               final       fails the job, naming each step that did not succeed
#   verify-*  one job per channel (COPR per Fedora release, the AUR, apt per distribution), after
#             `publish`, outside the environment, with no secrets; each installs the new version
#             from the live channel in a clean container (verify-channel.sh)
#
# All logic is in packaging/release/*.sh, which tests/scripts.rs runs with stubs. This file only
# calls them. No `run:` holds an expression: the tag, the dry-run flag and the secrets reach the
# scripts through `env:` (tests/scripts.rs pins every line that holds an expression).
#
# THE ENVIRONMENT. GitHub creates an environment, with NO protection, the first time a workflow
# names it. The maintainer must create `release` with a required reviewer and the four secrets
# (COPR_CONFIG, AUR_SSH_KEY, APT_SIGNING_KEY, APT_DEPLOY_KEY; task 5.5) BEFORE any release is
# published, or the first run reads whatever the unprotected environment holds. They must also set
# the environment's deployment branches and tags to `main` and tags matching `v*` only (Settings,
# Environments, release, Deployment branches and tags). Without that, anyone who can push a branch
# can dispatch THIS file as edited on that branch, and the only thing between that run and the
# secrets is the reviewer's click. That click is an approval, not a code review, and for a solo
# maintainer it is a click on one's own run.
#
# STABLE NAMES. After the gate step, every step runs the scripts of the TAG, with the `env:` of THIS
# file. So the env names the scripts read (TAG, DRY_RUN, COPR_CONFIG, AUR_SSH_KEY, APT_SIGNING_KEY,
# APT_DEPLOY_KEY, COPR_TOKEN_EXPIRES, COPR_OWNER, AUR_GIT_NAME, AUR_GIT_EMAIL, APT_GIT_NAME,
# APT_GIT_EMAIL, APT_WITHDRAWN, VERIFY_EXPECT_VERIFIER, GH_TOKEN) must stay
# as they are, or change only together with a re-tag: a rename breaks publishing of older tags
# (closed: the scripts stop on a missing value). The verification jobs run the tag's scripts the
# same way, so a tag from before verify-channel.sh existed cannot be verified here either. Likewise a tag cut before these scripts existed
# cannot be published here, and a fix to a script does not reach an existing tag without re-tagging.
#
# NEVER PUBLISH A RELEASE FROM A WORKFLOW. A release published with GITHUB_TOKEN fires no other
# workflow, so this one would never run.
#
# RUNNING IT BY HAND. `gh workflow run publish.yml --ref main -f tag=<tag>` (or --ref <tag>).
# The "Check out the tag and run its gate" step switches the run to the tag's own commit, so the
# scripts and packaging used are the tag's, not the dispatched branch's, and a tag that is not on
# main or does not match Cargo.toml fails before any secret is written. dry_run defaults to TRUE; a
# dry run reads everything and writes nothing (see packaging/release/route.sh and the channel
# scripts). The run still waits for the environment's approval.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, for example v0.1.0-beta.1. The release must be published.
        required: true
        type: string
      dry_run:
        description: Log the channels it would publish to and push, build and upload nothing.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# One run per tag at a time. A run waiting behind another is not cancelled. GitHub keeps ONE waiting
# run per group, so a third run for the same tag replaces the waiting second one: a known limit.
# `release.tag_name` is the tag on a release event and `inputs.tag` the dispatch input, so both
# triggers name the same group.
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# The COPR namespace (design Open Questions: NOT final). This is the ONLY place it is written; the
# scripts read COPR_OWNER and fail when it is unset. The AUR commits are made under this name; no
# personal address is in the repository.
env:
  COPR_OWNER: osirison
  AUR_GIT_NAME: proton-drive-sync-engine release
  AUR_GIT_EMAIL: noreply@github.com
  # The identity of the single commit pushed to the apt repository's gh-pages.
  APT_GIT_NAME: proton-drive-sync-engine release
  APT_GIT_EMAIL: noreply@github.com

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 300
    env:
      # Read-only (contents: read): lets gh read the release and download its assets.
      GH_TOKEN: ${{ github.token }}
    steps:
      # persist-credentials: false keeps the token out of .git; the scripts that need it get it
      # from the job's environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Choose the channels
        id: route
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: packaging/release/route.sh "$TAG"

      # Everything after this step runs the scripts and the packaging of the TAG, whatever branch the
      # run was started from, and only if the tag passes release.yml's gate (v plus the Cargo.toml
      # version, the commit on main, version.sh check). A tag made by hand on a commit that is not on
      # main stops here, before a secret is written. The tag was validated by route.sh.
      - name: Check out the tag and run its gate
        id: gate
        run: packaging/release/tag-checkout.sh "$PUBLISH_TAG"

      # copr-cli is not on the runner. Installed from a hash-locked file (every dependency pinned by
      # version and SHA-256; made with pip-compile, see the file's header), so nothing else is fetched.
      - name: Install copr-cli
        run: |
          python3 -m venv "$RUNNER_TEMP/copr-venv"
          "$RUNNER_TEMP/copr-venv/bin/pip" install --quiet --require-hashes --no-deps -r packaging/release/copr-cli-requirements.txt
          echo "$RUNNER_TEMP/copr-venv/bin" >> "$GITHUB_PATH"

      # apt-ftparchive (apt-utils) builds the apt tree; gpg, gpgv, git, jq and gh are on the runner.
      - name: Install apt-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends apt-utils

      # The secrets are read here and in no other step, and written to files in a directory only
      # this user can enter; the cleanup step at the end removes it.
      - name: Write the credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_DEPLOY_KEY: ${{ secrets.APT_DEPLOY_KEY }}
        run: packaging/release/credentials.sh write

      - name: Preflight
        id: preflight
        env:
          COPR_TOKEN_EXPIRES: ${{ vars.COPR_TOKEN_EXPIRES }}
        run: packaging/release/preflight.sh

      # A channel step runs even if the one before it failed, but only after a good preflight and
      # not after a cancel. Each records its own result for the final step.
      #
      # APT_WITHDRAWN (the repository variable of that name; optional) lists release tags to leave
      # out of the apt repository, which is how a version is withdrawn from it (docs/releasing.md).
      - name: apt
        id: apt
        if: "!cancelled() && steps.preflight.outcome == 'success'"
        env:
          APT_WITHDRAWN: ${{ vars.APT_WITHDRAWN }}
        run: packaging/release/apt-publish.sh "$PUBLISH_TAG"

      - name: AUR
        id: aur
        if: "!cancelled() && steps.preflight.outcome == 'success'"
        run: packaging/release/aur-publish.sh "$PUBLISH_TAG"

      - name: COPR
        id: copr
        if: "!cancelled() && steps.preflight.outcome == 'success'"
        run: packaging/release/copr.sh "$PUBLISH_TAG"

      # Fails the job when any step did not succeed, and names which. Skipped when the route step
      # itself failed: there is nothing to add to its message.
      - name: Check every step succeeded
        if: "always() && steps.route.outcome == 'success'"
        run: packaging/release/aggregate.sh preflight apt aur copr

      - name: Remove the credentials
        if: always()
        run: packaging/release/credentials.sh remove

  # --- The verification jobs (task 6.6, design D12) -------------------------------------------------
  # One per channel, after `publish`, OUTSIDE the environment and with no secret: they read only public
  # endpoints (COPR, the AUR, the apt site, the release's tarball). Each repeats the publish job's
  # first steps on its own runner, so that it too runs the TAG's scripts: route.sh (the channels the
  # release is routed to; a pre-release checks beta only), then tag-checkout.sh (the tag's commit and
  # its gate). Then verify-channel.sh runs the channel's check in a clean container of the
  # distribution being checked, with the checkout mounted read-only.
  #
  # Choices, recorded in design D12: `needs: publish` means a failed publish step skips every
  # verification (the run is already red and names the channel; re-run it with workflow_dispatch). A
  # dry run skips them too (it publishes nothing, so there is nothing to find). The Fedora list is a
  # third copy after FEDORA_OLDEST and smoke-rpm's matrix in packages.yml; a test holds the lists equal.

  verify-copr:
    needs: publish
    if: "!inputs.dry_run"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44"]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose the channels
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: packaging/release/route.sh "$TAG"
      - name: Check out the tag and run its gate
        run: packaging/release/tag-checkout.sh "$PUBLISH_TAG"
      - name: Install from COPR
        env:
          IMAGE: fedora:${{ matrix.fedora }}
        run: packaging/release/verify-channel.sh copr "$IMAGE"

  verify-aur:
    needs: publish
    if: "!inputs.dry_run"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose the channels
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: packaging/release/route.sh "$TAG"
      - name: Check out the tag and run its gate
        run: packaging/release/tag-checkout.sh "$PUBLISH_TAG"
      - name: Build the AUR package
        run: packaging/release/verify-channel.sh aur archlinux:base-devel

  # The three apt releases of the design (D10): the oldest, a recent one and the newest. `verifier`
  # is the signature checker apt has in that image, found on 2026-10-13 and asserted on every run:
  # Ubuntu 22.04 (apt 2.4) and 26.04 (apt 3.2) use gpgv, Debian 13 (apt 3.0) uses sqv.
  verify-apt:
    needs: publish
    if: "!inputs.dry_run"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            verifier: gpgv
          - image: debian:13
            verifier: sqv
          - image: ubuntu:26.04
            verifier: gpgv
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose the channels
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: packaging/release/route.sh "$TAG"
      - name: Check out the tag and run its gate
        run: packaging/release/tag-checkout.sh "$PUBLISH_TAG"
      - name: Install from the apt repository
        env:
          IMAGE: ${{ matrix.image }}
          VERIFY_EXPECT_VERIFIER: ${{ matrix.verifier }}
        run: packaging/release/verify-channel.sh apt "$IMAGE"
