name: Dependabot auto-merge

# Runs only for PRs opened by Dependabot. Enables GitHub auto-merge for security fixes (any
# semver) and semver-patch version bumps; GitHub then merges each once all required status
# checks are green. Minor/major NON-security bumps are intentionally left for manual review.
#
# Prerequisites (set outside this file): "Allow auto-merge" in repo settings, and branch
# protection on main with the CI + security-audit checks required — the required checks are
# what make `--auto` wait for green rather than merge immediately.
#
# There is deliberately NO `gh pr review --approve` step. It fails with
# "GitHub Actions is not permitted to approve pull requests (addPullRequestReview)" whenever
# the repo's `actions/permissions/workflow` has `can_approve_pull_request_reviews: false`,
# which is the default — and that failure aborted the step before `gh pr merge --auto` ran,
# so every eligible bump stalled (6 open PRs, 46 commits stale, before this was found).
# It is also unnecessary: main's protection sets `required_pull_request_reviews: null`, so
# `--auto` needs only green checks. If required reviews are ever enabled, restoring the
# approve step is NOT the fix — GITHUB_TOKEN cannot supply it. Use a PAT or GitHub App.
on: pull_request

# Default to read-only; only the auto-merge job (and only for Dependabot PRs) elevates.
permissions:
  contents: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge (security fixes + patch bumps)
        if: steps.meta.outputs.ghsa-id != '' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
