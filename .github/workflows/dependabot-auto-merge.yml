name: Dependabot auto-merge

# Runs only for PRs opened by Dependabot. Enables GitHub auto-merge for semver-patch bumps and
# for security fixes of any semver; GitHub then merges each once all required status checks are
# green. Minor/major NON-security bumps are intentionally left for manual review.
#
# Two jobs, so that no job holds both a secret and write rights:
#   decide      reads (contents + pull-requests: read). It holds DEPENDABOT_ALERTS_TOKEN, runs
#               fetch-metadata and a checkout of the PR's BASE commit, and runs the decision
#               script. It publishes one output, `arm`.
#   auto-merge  writes (contents + pull-requests: write). It has no checkout, runs no repository
#               code and holds no secret but its own GITHUB_TOKEN: `gh pr merge --auto`, and only
#               when `decide` succeeded and said `arm == 'true'`. A failed or skipped `decide`
#               skips it, because a job's implicit `success()` covers `needs`.
#
# A security fix is decided by .github/scripts/dependabot-security-fix.sh, which asks the REST
# alerts API itself: one dependency, an open alert for exactly that package in exactly that
# manifest, the old version inside the alert's vulnerable range, the new version at or above the
# first patched version, in the same compatibility line, and inside no other open alert's range.
# dependabot/fetch-metadata's own `alert-lookup` is not used: it compares the alert's requirement
# with "= <version>", never matches, and leaves `ghsa-id` empty (#494). The script is read from
# the PR's BASE commit, never from the PR's own tree.
#
# Prerequisites (set outside this file): "Allow auto-merge" in repo settings, and branch
# protection on main with the CI + security-audit checks required — the required checks are
# what make `--auto` wait for green rather than merge immediately.
#
# There is deliberately NO `gh pr review --approve` step. Under the default repo setting
# `actions/permissions/workflow` → `can_approve_pull_request_reviews: false`, it fails with
#
#   failed to create review: GraphQL: GitHub Actions is not permitted to approve pull
#   requests. (addPullRequestReview)
#
# `run:` uses `bash -e`, so that aborted the step *before* `gh pr merge --auto` — leaving
# every eligible bump open and un-armed, and showing as a red `auto-merge` check that reads
# like the PR failed rather than like the automation never started. (Found 2026-08-15, after
# it had silently stalled every Dependabot PR since the workflow landed in #144.)
#
# The approval is also unnecessary here: main's protection sets
# `required_pull_request_reviews: null`, so `--auto` waits only on the required checks.
# If required reviews are ever enabled, do NOT restore this step and flip that repo setting
# to buy it — that grants Actions approval rights over every PR in the repo. Use a PAT or a
# GitHub App instead.
on: pull_request

# Default to read-only; only the auto-merge job (and only after `decide` approved) elevates.
permissions:
  contents: read

jobs:
  decide:
    # The event's actor AND the PR's author must both be Dependabot.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Read only. fetch-metadata lists the PR's commits (pull-requests: read, as in its README) and
    # the checkout reads the repository (contents: read).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 'true' when the lookup said fix, or the bump is a patch. Anything else does not arm. A
      # skipped lookup (a patch bump) leaves `fix` empty, so a patch bump still arms.
      arm: ${{ steps.security.outputs.fix == 'true' || steps.meta.outputs.update-type == 'version-update:semver-patch' }}
    # DEPENDABOT_ALERTS_TOKEN is an optional Dependabot secret (Settings > Secrets and variables >
    # Dependabot): a fine-grained token for THIS repository only with "Dependabot alerts:
    # Read-only" (Metadata read is implied). Only the "Look for a security fix" step reads it,
    # in its own `env:`. That step is in the `decide` job, which has no write right, and no
    # third-party action or other step holds the token.
    #   Missing: the script logs that and says fix=false, so only patch bumps auto-merge.
    #   Expired or revoked: the lookup fails (401/403), this job goes red, `auto-merge` is
    #   skipped and a non-patch bump is not armed; patch bumps skip the step and still arm.
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        # Default GITHUB_TOKEN: enough to read the PR. No alert lookup (see the header).
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Check out the decision script from the base commit
        # A patch bump arms regardless, so it needs no script. The base commit, not the PR head:
        # the PR's own tree must not decide whether the PR is trusted.
        if: steps.meta.outputs.update-type != 'version-update:semver-patch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Look for a security fix
        id: security
        if: steps.meta.outputs.update-type != 'version-update:semver-patch'
        run: bash .github/scripts/dependabot-security-fix.sh
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          DEP_GROUP: ${{ steps.meta.outputs.dependency-group }}
          PREVIOUS: ${{ steps.meta.outputs.previous-version }}
          NEW: ${{ steps.meta.outputs.new-version }}

  auto-merge:
    needs: decide
    # `needs.decide.result` must be success (the implicit success() of a job `if:`) and the
    # decision must be 'true'.
    if: needs.decide.outputs.arm == 'true'
    runs-on: ubuntu-latest
    # The only job with write rights. No checkout and no repository code: the PR URL is the only
    # input, and it comes from the event.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (security fixes + patch bumps)
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
