name: CI

on:
  push:
    branches:
      - main
      - master
      - "copilot/**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux build deps
        # Required by the gui/src-tauri workspace member (webkit2gtk-4.1 + libsoup-3.0 link at build
        # time). Kept here so the whole workspace builds/lints/tests on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `--workspace` is load-bearing on Lint/Test: this workspace's root is itself a package, so
      # Cargo's default member selection collapses to that root package alone — without the flag,
      # `gui/gui-core` and `gui/src-tauri` are never linted and their tests never run. (`cargo fmt
      # --all` already spans every member, so Format needs no flag.)
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features

  # The desktop app's webview frontend (gui/src): vanilla ES modules served RAW by Tauri
  # ("frontendDist": "../src", and deliberately no beforeBuildCommand), so there is no bundler and
  # no build step — this job only lints and format-checks. A bad import specifier is therefore not
  # a build error but a blank window at runtime, which is the bug class the lint gate exists for.
  #
  # Deliberately NOT `needs: rust` — it only wants Node, so it runs in parallel rather than queueing
  # behind the Tauri apt install.
  #
  # Deliberately NOT path-filtered either. This job is intended to become a required status check on
  # main, and a required check that is path-filtered never reports on PRs outside its filter: those
  # PRs would sit forever on "Expected — waiting for status to be reported", which would also stall
  # Dependabot auto-merge. Keeping it unfiltered is what makes it safe to mark as required.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Resolved from the repo root, not from `defaults.run.working-directory` — same as the
          # website job in docs.yml. `npm ci` requires the committed gui/package-lock.json.
          cache-dependency-path: gui/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Step order mirrors the `rust` job above.
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      # Invisible characters — a NUL, a no-break space, a zero-width joiner. S3 shipped a literal
      # NUL inside a template string and every gate stayed green while git reclassified the whole
      # 600-line screen as a binary blob: no diff, no blame, no grep. See gui/tools/check-sources.mjs.
      - name: Sources
        run: npm run sources:check
      # Three things no linter can see, all invisible until someone opens the app in the affected
      # theme: the two copies of the light palette agreeing (plain CSS cannot share one declaration
      # list between a media query and a selector), every themed token having a value in both
      # themes, and no raw colour outside tokens.css. See gui/tools/check-tokens.mjs.
      - name: Tokens
        run: npm run tokens:check
      # The fixture registry (F9): every in-scope frame has a dataset, of the shape its frame class
      # implies, and every `fids` key names a node that exists in that frame. It lives here rather
      # than in `fidelity` because it needs no browser — and the stale-key check it does is one
      # assert.mjs can only make for nodes a built screen actually stamps, at runtime.
      - name: Fixtures
        run: npm run fidelity:fixtures
      # `node --test`, no framework and no dependency — it is in the Node 22 this job already
      # installs. The frontend is mostly DOM composition that a unit test cannot say much about;
      # what is here is the logic that is pure, load-bearing and not re-derivable from reading it.
      # nextOnboardingLatch is the first: it is why onboarding is reachable on a fresh machine, and
      # every branch of it is a bug that shipped once already.
      - name: Test
        run: npm test

  # The fidelity gate (F8). Its own job rather than a step in `frontend`, for one reason: it needs a
  # Chromium download, and `frontend` is a 15-second lint job that many PRs depend on. Keeping them
  # apart means a dependency bump does not wait on a browser.
  #
  # Deliberately NOT path-filtered, for the same reason `frontend` is not: this is intended to become
  # a required check, and a required check that is path-filtered never reports on PRs outside its
  # filter — they sit forever on "Expected — waiting for status to be reported".
  fidelity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install dependencies
        run: npm ci
      # The style and fit gates against every frame the app maps, then the copy gate over all 339
      # drawn strings in ui/copy.js (it said 224 — that was S4's count, and five screens have landed
      # since), then the contrast gate, which reads every text node in BOTH themes because the seven
      # screens with no drawn light frame have no other check (S10).
      # See gui/tools/fidelity/README.md for what all of them cannot cover.
      - name: Fidelity
        run: npm run fidelity
      # The fixtures are checked in so a prototype change is a reviewable diff. If regenerating them
      # produces one, they are stale — the prototype moved and nobody re-extracted.
      # Re-extracts to a temp directory and compares with the SAME tolerances the gate uses, rather
      # than `git diff`. Sub-pixel text layout is not byte-identical across platforms even with the
      # same font files, so a byte comparison here reports the runner, not staleness — the mistake
      # that had already cost this PR a round of phantom failures.
      - name: Fixtures are up to date
        run: npm run fidelity:stale
      # Two extractions on ONE machine must produce identical bytes. Cheaper than discovering an
      # unpinned input by watching a developer and a runner disagree, which is how the previous four
      # were found.
      - name: Extraction is deterministic
        run: npm run fidelity:determinism
      # The five symbolic SVGs the tray hands the desktop are GENERATED from the marks on
      # `10a Glyph states` — the same nodes the style gate compares — so that the icon on a panel and
      # the drawing in the gate cannot be two different hexagons. Checked in (a tray icon is a
      # reviewable artefact, and the app reads them at runtime), so they can go stale the moment
      # ui/hexagon.js changes and nothing else would notice: the icon lives in the one surface of the
      # app nobody inspects. Here rather than in `frontend` because it needs the same Chromium.
      - name: Tray glyphs match what the app draws
        run: npm run glyphs:check
