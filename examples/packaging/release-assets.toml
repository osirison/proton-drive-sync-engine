# Minimal release asset manifest for a user-service distribution.

[binaries]
daemon = "proton-syncd"
control_cli = "proton-sync"

[config]
sample = "examples/proton-sync.toml"
install_path = "~/.config/proton-sync/proton-sync.toml"

[systemd]
unit = "examples/systemd/proton-syncd.service"
install_helper = "examples/systemd/install-user-service.sh"
user_unit_path = "~/.config/systemd/user/proton-syncd.service"

[packaging]
archive_helper = "examples/packaging/build-release-archive.sh"
default_archive = "target/dist/proton-drive-sync-engine-0.1.0.tar.gz"