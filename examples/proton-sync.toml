# Copy this file to ~/.config/proton-sync/proton-sync.toml and edit the paths.

local_root = "/home/me/ProtonDrive"
remote_root = "/Drive/RemoteFolder"
scan_interval_secs = 300
proton_cli = "proton-drive"
proton_timeout_secs = 60
proton_list_attempts = 2

# Optional selective sync rules. Paths are relative to local_root and remote_root.
include = ["Documents/**", "Projects/**/*.md"]
exclude = ["**/*.tmp", "**/.DS_Store"]

# Set true when you want the configured service to print a plan and exit.
dry_run = false

# Optional overrides. When omitted, the daemon uses these defaults:
# db_path and lockfile_path live in the per-root ".sync" state directory (ignored by sync)
# socket_path stays under $XDG_RUNTIME_DIR (or the OS temp directory fallback)
# db_path = "/home/me/Proton/.sync/sync_index.db"
# lockfile_path = "/home/me/Proton/.sync/proton-sync.lock"
# socket_path = "/run/user/1000/proton-sync.sock"