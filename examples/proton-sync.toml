# Copy this file to ~/.config/proton-sync/proton-sync.toml and edit the paths.

local_root = "/home/me/ProtonDrive"
remote_root = "/Drive/RemoteFolder"
scan_interval_secs = 300
# A bare name is resolved via PATH. When the daemon runs as a systemd user service it can start
# before the login PATH is imported and fail to find the CLI ("could not run the proton-drive CLI
# ... No such file or directory"). Set an absolute path to bypass PATH entirely, e.g.:
#   proton_cli = "~/.local/bin/proton-drive"
proton_cli = "proton-drive"
proton_timeout_secs = 60
proton_list_attempts = 2

# How many planned downloads to bundle into one proton-drive invocation. Batches are
# chunked per destination folder and checkpoint-committed as each chunk lands, so an
# interrupted bulk download keeps its completed files. Set 1 to download one file per
# invocation (the pre-batching behavior).
download_batch_size = 25

# Optional selective sync rules. Paths are relative to local_root and remote_root.
include = ["Documents/**", "Projects/**/*.md"]
exclude = ["**/*.tmp", "**/.DS_Store"]

# Set true when you want the configured service to print a plan and exit.
dry_run = false

# Delete-approval guard (daemon-wide default; ON in both directions unless changed here).
# When on, a deletion is withheld until you approve it with `proton-sync approve <path>`.
# `remote` gates deleting a file on Proton Drive because you removed it locally;
# `local` gates deleting a file on your local disk because it was removed/trashed on Proton Drive.
# For per-folder overrides, drop a `.proton-sync.toml` with a `[delete_approval]` table in any
# directory under local_root — it applies to that directory and everything beneath it, and is
# never itself synced.
# [delete_approval]
# remote = true
# local = true

# Optional overrides. When omitted, the daemon uses these defaults:
# db_path and lockfile_path live in the per-root ".sync" state directory (ignored by sync)
# socket_path stays under $XDG_RUNTIME_DIR (or the OS temp directory fallback)
# db_path = "/home/me/Proton/.sync/sync_index.db"
# lockfile_path = "/home/me/Proton/.sync/proton-sync.lock"
# socket_path = "/run/user/1000/proton-sync.sock"